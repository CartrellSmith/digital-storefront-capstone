<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>

    <!-- Correct Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#CAD5E3] text-black/80 font-sans leading-relaxed"">
    <header>
            <div class=" flex items-center justify-between px-4">

        <!-- Logo -->
        <a href="index.html"><img src="assets/images/Logo_4.png" alt="Kannon's Home Furniture & Decor Logo" class="w-32 hover:scale-105 hover:drop-shadow-xl 
                transition-all duration-300"></a>

        <!-- Search Bar -->
            <input 
                id="search-bar" 
                type="text" 
                placeholder="Search" 
                class="w-40 px-2 border rounded border-black" 
            />
            <div id="search-results" class="bg-white shadow-md rounded mt-2 hidden"></div>
            
        <!-- Navigation -->
        <ul class="flex gap-4 items-center ml-4 flex-wrap">
            <li><a href="index.html" class="font-semibold tracking-wide relative
            after:content-[''] after:absolute after:left-0 after:bottom-0 
            after:w-0 after:h-[2px] after:bg-black 
            after:transition-all after:duration-300
            hover:after:w-full">
                    Home</a></li>
            <li><a href="Product.html" class="font-semibold tracking-wide relative
            after:content-[''] after:absolute after:left-0 after:bottom-0 
            after:w-0 after:h-[2px] after:bg-black 
            after:transition-all after:duration-300
            hover:after:w-full">
                    Products</a></li>
            <li><a href="About.html" class="font-semibold tracking-wide relative
            after:content-[''] after:absolute after:left-0 after:bottom-0 
            after:w-0 after:h-[2px] after:bg-black 
            after:transition-all after:duration-300
            hover:after:w-full">
                    About</a></li>
            <li><a href="Contact.html" class="font-semibold tracking-wide relative
            after:content-[''] after:absolute after:left-0 after:bottom-0 
            after:w-0 after:h-[2px] after:bg-black 
            after:transition-all after:duration-300
            hover:after:w-full">
                    Contact</a></li>
        </ul>
        <!--Shopping Cart-->
        <div class="relative">
            <a href="cart.html" class="text-2xl underline">
                🛒
            </a>

            <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold 
                    w-5 h-5 flex items-center justify-center rounded-full">
                0
            </span>
        </div>
        </div>
        </header>

    <main class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">Your Cart</h1>

        <!-- Cart Items -->
        <div id="cart-items" class="space-y-4"></div>

        <!-- Order Summary -->
        <div class="mt-8 p-4 bg-white rounded-lg shadow">
            <h2 class="text-xl font-semibold">Order Summary</h2>
            <p class="mt-2 text-lg">Total: $<span id="cart-total">0</span></p>
        </div>
    </main>

    <script src="js/slideshow.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/products.js"></script>
    <script src="js/search.js"></script>
</body>

</html>
