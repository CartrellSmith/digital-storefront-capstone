<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>

    <!-- Correct Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="styles.css" rel="stylesheet">
</head>

<body class="bg-[#CAD5E3] text-black/80 font-sans leading-relaxed">
    <!-- GLOBAL LOADER -->
    <div id="global-loader" class="fixed inset-0 bg-white/70 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-300 border-t-black"></div>
    </div>

    <header class="bg-[#CAD5E3] sticky top-0 z-50">
        <div class="flex items-center justify-between px-4 py-2">

            <!-- Logo -->
            <a href="index.html">
                <img src="assets/images/Logo_4.png" 
                    alt="Kannon's Home Furniture & Decor Logo" 
                    class="w-32 hover:scale-105 hover:drop-shadow-xl transition-all duration-300">
            </a>

            <!-- Search Bar (ALWAYS visible) -->
            <div class="flex-1 px-4">
                <input 
                    id="search-bar" 
                    type="text" 
                    placeholder="Search" 
                    class="w-full max-w-xs px-2 py-1 border rounded border-black"
                />
                <div id="search-results" class="bg-white shadow-md rounded mt-2 hidden"></div>
            </div>

            <!-- Desktop Navigation (hidden on mobile) -->
            <nav class="hidden md:block">
                <ul class="flex gap-4 items-center ml-4">
                    <li><a href="index.html" class="text-black font-semibold tracking-wide relative
                        after:content-[''] after:absolute after:left-0 after:bottom-0 
                        after:w-0 after:h-[2px] after:bg-black 
                        after:transition-all after:duration-300
                        hover:after:w-full">Home</a></li>

                    <li><a href="Product.html" class="text-black font-semibold tracking-wide relative
                        after:content-[''] after:absolute after:left-0 after:bottom-0 
                        after:w-0 after:h-[2px] after:bg-black 
                        after:transition-all after:duration-300
                        hover:after:w-full">Products</a></li>

                    <li><a href="About.html" class="text-black font-semibold tracking-wide relative
                        after:content-[''] after:absolute after:left-0 after:bottom-0 
                        after:w-0 after:h-[2px] after:bg-black 
                        after:transition-all after:duration-300
                        hover:after:w-full">About</a></li>

                    <li><a href="Contact.html" class="text-black font-semibold tracking-wide relative
                        after:content-[''] after:absolute after:left-0 after:bottom-0 
                        after:w-0 after:h-[2px] after:bg-black 
                        after:transition-all after:duration-300
                        hover:after:w-full">Contact</a></li>
                </ul>
            </nav>

            <!-- Shopping Cart (ALWAYS visible) -->
            <div class="relative ml-4">
                <a href="cart.html" class="text-2xl underline">🛒</a>
                <span id="cart-count" 
                    class="absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold 
                            w-5 h-5 flex items-center justify-center rounded-full">
                    0
                </span>
            </div>

            <!-- Hamburger Button (mobile only) -->
            <button id="menu-btn" class="md:hidden text-3xl ml-4">
                ☰
            </button>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#CAD5E3] shadow-lg">
            <ul class="flex flex-col text-lg font-medium p-4 space-y-4">
                <li>
                    <a href="index.html" 
                    class="relative after:content-[''] after:absolute after:left-0 after:bottom-0 
                            after:w-0 after:h-[2px] after:bg-black after:transition-all after:duration-300
                            hover:after:w-full">
                        Home
                    </a>
                </li>

                <li>
                    <a href="Product.html" 
                    class="relative after:content-[''] after:absolute after:left-0 after:bottom-0 
                            after:w-0 after:h-[2px] after:bg-black after:transition-all after:duration-300
                            hover:after:w-full">
                        Products
                    </a>
                </li>

                <li>
                    <a href="About.html" 
                    class="relative after:content-[''] after:absolute after:left-0 after:bottom-0 
                            after:w-0 after:h-[2px] after:bg-black after:transition-all after:duration-300
                            hover:after:w-full">
                        About
                    </a>
                </li>

                <li>
                    <a href="Contact.html" 
                    class="relative after:content-[''] after:absolute after:left-0 after:bottom-0 
                            after:w-0 after:h-[2px] after:bg-black after:transition-all after:duration-300
                            hover:after:w-full">
                        Contact
                    </a>
                </li>

            </ul>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-6">Your Cart</h1>

        <!-- Cart Items -->
        <div id="cart-items" class="space-y-4"></div>

        <!-- Order Summary -->
        <div class="mt-8 p-4 bg-white rounded-lg shadow">
            <h2 class="text-xl font-semibold">Order Summary</h2>
            <p class="mt-2 text-lg">Total: $<span id="cart-total-value">0</span></p>
        </div>
    </main>
    <script src="js/products.js"></script>
    <script src="js/product-page.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/slideshow.js"></script>
    <script src="js/search.js"></script>
    </body>
</html>
